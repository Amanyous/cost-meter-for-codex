<!doctype html>
<meta charset="utf-8">
<title>Cost Meter UI Harness</title>
<style>body{margin:0;padding:16px;background:#f5f5f5}iframe{display:block;width:100%;height:760px;border:1px solid #ddd;border-radius:12px;background:#fff}</style>
<iframe id="app" src="../lib/codex-ui.html"></iframe>
<script>
const state = {
  meta: { dayKey: '2026-09-14', generatedAt: Date.now(), currency: 'USD', exchangeRate: 7.2, locale: 'zh', eventCount: 3 },
  today: { calls: 2, input: 1200, output: 300, cacheRead: 500, cacheWrite: 0, reasoning: 20, total: 2020, costUsd: 0.012345, unpricedCalls: 0 },
  session: { id: 'thread-demo', calls: 2, input: 1200, output: 300, cacheRead: 500, cacheWrite: 0, reasoning: 20, total: 2020, costUsd: 0.012345, unpricedCalls: 0, lastAtMs: Date.now() },
  total: { calls: 8, input: 5200, output: 1300, cacheRead: 1800, cacheWrite: 0, reasoning: 90, total: 8300, costUsd: 0.045678, unpricedCalls: 0 },
  history: [
    { date: '2026-09-14', calls: 2, input: 1200, output: 300, cacheRead: 500, cacheWrite: 0, reasoning: 20, total: 2020, costUsd: 0.012345, sessions: [{ id: 'thread-demo', calls: 2, total: 2020, costUsd: 0.012345 }] },
    { date: '2026-09-13', calls: 6, input: 4000, output: 1000, cacheRead: 1300, cacheWrite: 0, reasoning: 70, total: 6280, costUsd: 0.033333, sessions: [{ id: 'thread-old', calls: 6, total: 6280, costUsd: 0.033333 }] },
  ],
  models: [
    { provider: 'custom', model: 'deepseek-v4-flash', calls: 5, total: 4300, costUsd: 0.015, unpricedCalls: 0 },
    { provider: 'openai', model: 'gpt-5.3-codex', calls: 3, total: 4000, costUsd: 0.030678, unpricedCalls: 0 },
  ],
  unpriced: [],
  sessions: [],
}
const app = document.getElementById('app')
app.addEventListener('load', () => {
  app.contentWindow.openai = {
    availableDisplayModes: ['inline', 'fullscreen', 'picture-in-picture'],
    displayMode: 'inline',
    requestDisplayMode: async ({ mode }) => {
      app.contentWindow.openai.displayMode = mode
      return { mode }
    },
  }
})
window.addEventListener('message', event => {
  if (event.source !== app.contentWindow) return
  const message = event.data
  if (!message || message.jsonrpc !== '2.0' || message.id === undefined) return
  let result = {}
  if (message.method === 'ui/initialize') result = { protocolVersion: '2026-01-26', hostCapabilities: {} }
  else if (message.method === 'tools/call') result = { content: [{ type: 'text', text: 'ok' }], structuredContent: state }
  app.contentWindow.postMessage({ jsonrpc: '2.0', id: message.id, result }, '*')
})
</script>
